name: Mobile tests

on:
  workflow_dispatch:
    inputs:
      context:
        description: "Где запускать мобильные тесты"
        type: choice
        options:
          - emulator
          - bstack
        default: emulator

jobs:
  mobile-tests:
    name: Mobile tests (${{ inputs.context }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js (для Appium)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install -g appium
          appium driver install uiautomator2

      - name: Enable KVM (для Android-эмулятора)
        if: inputs.context == 'emulator'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Appium server
        run: |
          nohup appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 &
          sleep 10
          curl -s http://127.0.0.1:4723/status

      - name: Run mobile tests on emulator
        if: inputs.context == 'emulator'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          INAT_APP_ID: ${{ secrets.INAT_APP_ID }}
          INAT_APP_SECRET: ${{ secrets.INAT_APP_SECRET }}
          INAT_USERNAME: ${{ secrets.INAT_USERNAME }}
          INAT_PASSWORD: ${{ secrets.INAT_PASSWORD }}
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: pytest tests/Mobile --context emulator --alluredir=allure-results

      - name: Run mobile tests on BrowserStack
        if: inputs.context == 'bstack'
        env:
          INAT_APP_ID: ${{ secrets.INAT_APP_ID }}
          INAT_APP_SECRET: ${{ secrets.INAT_APP_SECRET }}
          INAT_USERNAME: ${{ secrets.INAT_USERNAME }}
          INAT_PASSWORD: ${{ secrets.INAT_PASSWORD }}
          BS_USER: ${{ secrets.BS_USER }}
          BS_KEY: ${{ secrets.BS_KEY }}
          BS_APP_ID: ${{ secrets.BS_APP_ID }}
        run: pytest tests/Mobile --context bstack --alluredir=allure-results

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-mobile
          path: allure-results
          retention-days: 14

      - name: Upload Appium log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: appium.log
          retention-days: 7
